name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: node --check src/server.js

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m

          script: |
            set -e

            REPO_DIR="/var/www/backend/mern-student-github-action"
            APP_DIR="$REPO_DIR/backend"
            OLD_APP_DIR="/var/www/backend/mern-backend-gh-action/backend"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="main"

            echo "======================================"
            echo "Backend deployment started"
            echo "======================================"

            mkdir -p /var/www/backend

            if [ -d "$REPO_DIR/.git" ]; then

              echo "Updating existing repository..."
              cd "$REPO_DIR"

              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"

              # Keep production environment file
              git clean -fd \
                -e backend/.env

            else

              echo "Repository not found. Cloning..."
              
              if [ -e "$REPO_DIR" ]; then
                echo "ERROR: $REPO_DIR exists but is not a Git repository."
                exit 1
              fi

              git clone \
                --branch "$BRANCH" \
                --single-branch \
                "$REPO_URL" \
                "$REPO_DIR"

            fi

            echo "Preparing backend directory..."
            mkdir -p "$APP_DIR"

            # Preserve existing .env from previous deployment
            if [ ! -f "$APP_DIR/.env" ] && [ -f "$OLD_APP_DIR/.env" ]; then
              echo "Copying existing production .env..."
              cp "$OLD_APP_DIR/.env" "$APP_DIR/.env"
            fi

            cd "$APP_DIR"

            # Production environment is required
            if [ ! -f ".env" ]; then
              echo "ERROR: Production .env file is missing."
              exit 1
            fi

            echo "Installing production dependencies..."
            npm ci --omit=dev

            echo "======================================"
            echo "Restarting backend with PM2"
            echo "======================================"

            if pm2 describe backend > /dev/null 2>&1; then

              echo "Existing PM2 process found."
              pm2 reload backend

            else

              echo "PM2 process not found. Starting backend..."
              pm2 start src/server.js --name backend

            fi

            pm2 save

            echo "Waiting for backend..."
            sleep 5

            echo "Running health check..."

            HTTP_STATUS=$(curl -sS \
              --max-time 10 \
              -o /dev/null \
              -w "%{http_code}" \
              http://localhost:5000/api/health || true)

            if [ "$HTTP_STATUS" = "200" ]; then

              echo "======================================"
              echo "SUCCESS: Backend health check passed"
              echo "HTTP Status: $HTTP_STATUS"
              echo "======================================"

            else

              echo "======================================"
              echo "ERROR: Backend health check failed"
              echo "HTTP Status: $HTTP_STATUS"
              echo "======================================"

              pm2 status
              pm2 logs backend --lines 30 --nostream

              exit 1

            fi

            echo "Deployment finished: $(date)"
