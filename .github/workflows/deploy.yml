name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: node --check src/server.js

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e

            REPO_DIR="/var/www/backend/mern-student-github-action"
            APP_DIR="$REPO_DIR/backend"
            OLD_APP_DIR="/var/www/backend/mern-backend-gh-action/backend"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="main"

            echo "Deployment started: $(date)"

            mkdir -p /var/www/backend

            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"

              # Preserve server-side configuration files
              git clean -fd \
                -e backend/.env \
                -e backend/ecosystem.config.js
            else
              if [ -e "$REPO_DIR" ]; then
                echo "ERROR: $REPO_DIR exists but is not a Git repository."
                exit 1
              fi

              git clone --branch "$BRANCH" \
                --single-branch "$REPO_URL" "$REPO_DIR"
            fi

            # Keep existing production configuration when migrating
            # from the previous deployment directory.
            mkdir -p "$APP_DIR"

            if [ ! -f "$APP_DIR/.env" ] && [ -f "$OLD_APP_DIR/.env" ]; then
              cp "$OLD_APP_DIR/.env" "$APP_DIR/.env"
            fi

            if [ ! -f "$APP_DIR/ecosystem.config.js" ] \
              && [ -f "$OLD_APP_DIR/ecosystem.config.js" ]; then
              cp "$OLD_APP_DIR/ecosystem.config.js" \
                "$APP_DIR/ecosystem.config.js"
            fi

            cd "$APP_DIR"

            if [ ! -f ".env" ]; then
              echo "ERROR: Production .env file is missing."
              exit 1
            fi

            if [ ! -f "ecosystem.config.js" ]; then
              echo "ERROR: ecosystem.config.js is missing."
              exit 1
            fi

            echo "Installing production dependencies..."
            npm ci --omit=dev

            echo "Restarting backend..."
            if pm2 describe backend-api > /dev/null 2>&1; then
              pm2 reload ecosystem.config.js --env production
            else
              pm2 start ecosystem.config.js --env production
            fi

            pm2 save

            echo "Waiting for application..."
            sleep 5

            echo "Running health check..."
            HTTP_STATUS=$(curl -sS --max-time 10 \
              -o /dev/null \
              -w "%{http_code}" \
              http://localhost:5000/api/health || true)

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "SUCCESS: Health check passed."
            else
              echo "ERROR: Health check returned HTTP $HTTP_STATUS"
              pm2 logs backend-api --lines 30 --nostream
              exit 1
            fi

            echo "Deployment finished: $(date)"